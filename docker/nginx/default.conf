server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # --- Feltöltés ---
    # A méretkorlát a PHP post_max_size-hoz igazodik. Az időkorlátok azért
    # bőségesek, mert egy építkezésről, mobilhálózaton érkező feltöltés lassú:
    # a nginx alapértelmezett 60 másodperces client_body_timeout-ja két csomag
    # között is eltelhet, és a kérés a semmiért szakadna meg.
    client_max_body_size 140M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    client_body_buffer_size 256k;
    send_timeout 300s;

    # --- Tömörítés ---
    # Mobilhálózaton érezhető: az Inertia JSON-válaszok és a lefordított
    # JS/CSS csomag is jócskán összemegy.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # A Vite lenyomatos (hash-elt) állományai sosem változnak ugyanazon a néven.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        # A nagy multipart törzs egyben menjen át, ne 8k-s darabokban.
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
